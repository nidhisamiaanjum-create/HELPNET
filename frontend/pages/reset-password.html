{% load static %}
<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reset Password | HELPNET</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="site-header">
    <a href="/" class="logo">
        হেল্পনেট
    </a>
<button id="langToggle" class="lang-toggle" data-i18n="langButton">English</button></header>

<main class="page">

    <section class="card">

        <h1 data-i18n="resetPasswordTitle">নতুন পাসওয়ার্ড সেট করুন</h1>

        <p class="subtitle" data-i18n="resetPasswordSubtitle">
            আপনার নতুন পাসওয়ার্ড দিন।
        </p>

        <form id="resetPasswordForm">

            <div class="field">

                <label for="newPassword" data-i18n="newPassword">
                    নতুন পাসওয়ার্ড
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="new_password"
                    minlength="8"
                    required
                >

            </div>

            <div class="field">

                <label for="confirmPassword" data-i18n="confirmPassword">
                    পাসওয়ার্ড আবার লিখুন
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                >

            </div>

            <p
                id="resetPasswordMessage"
                class="form-message"
                hidden
            ></p>

            <button
                type="submit"
                class="btn"
                id="resetPasswordButton"
                data-i18n="updatePassword"
            >
                পাসওয়ার্ড পরিবর্তন করুন
            </button>

        </form>

        <p class="back-row">
            <a href="/login/" class="back-link" data-i18n="backToLogin">
                ← Login এ ফিরে যান
            </a>
        </p>

    </section>

</main>

<script src="{% static 'js/reset-password.js' %}"></script>

<script src="{% static 'js/i18n.js' %}"></script></body>
</html>
