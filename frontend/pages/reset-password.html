{% load static %}
<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reset Password | HELPNET</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="site-header">
    <a href="/" class="logo">
        হেল্পনেট
    </a>
</header>

<main class="page">

    <section class="card">

        <h1>নতুন পাসওয়ার্ড সেট করুন</h1>

        <p class="subtitle">
            আপনার নতুন পাসওয়ার্ড দিন।
        </p>

        <form id="resetPasswordForm">

            <div class="field">

                <label for="newPassword">
                    নতুন পাসওয়ার্ড
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="new_password"
                    minlength="8"
                    required
                >

            </div>

            <div class="field">

                <label for="confirmPassword">
                    পাসওয়ার্ড আবার লিখুন
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                >

            </div>

            <p
                id="resetPasswordMessage"
                class="form-message"
                hidden
            ></p>

            <button
                type="submit"
                class="btn"
                id="resetPasswordButton"
            >
                পাসওয়ার্ড পরিবর্তন করুন
            </button>

        </form>

        <p class="back-row">
            <a href="/login/" class="back-link">
                ← Login এ ফিরে যান
            </a>
        </p>

    </section>

</main>

<script src="{% static 'js/reset-password.js' %}"></script>

</body>
</html>
