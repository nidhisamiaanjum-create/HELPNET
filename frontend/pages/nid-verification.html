{% load static %}

<!doctype html>

<html lang="bn"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1">

<title>NID যাচাই | HELPNET</title>

<link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<header class="site-header">

<!-- Back to Profile -->
<a href="/profile/" class="logo" data-i18n="appName">
    হেল্পনেট
</a>

<div class="header-actions">

    <!-- Language -->
    <button
        type="button"
        id="langToggle"
        class="lang-toggle">
        English
    </button>

    <!-- Logout -->
    <button
        type="button"
        id="logoutButton"
        class="lang-toggle"
        data-i18n="logout">
        লগআউট
    </button>

</div>

</header>

<main class="page">

<!-- =========================
     NID VERIFICATION CARD
     ========================= -->

<section class="card">

    <h1 data-i18n="nidTitle">
        NID যাচাই
    </h1>

    <p class="subtitle" data-i18n="nidSubtitle">
        আপনার পরিচয় যাচাই করলে কমিউনিটিতে আস্থা বাড়ে।
    </p>


    <form id="nidVerificationForm" novalidate>

        <!-- Document Type -->
        <div class="field">

            <label
                for="documentType"
                data-i18n="documentType">
                নথির ধরন
            </label>

            <select id="documentType" name="document_type">

                <option
                    value="nid"
                    data-i18n="docNid">
                    জাতীয় পরিচয়পত্র (NID)
                </option>

                <option
                    value="passport"
                    data-i18n="docPassport">
                    পাসপোর্ট
                </option>

                <option
                    value="birth_certificate"
                    data-i18n="docBirth">
                    জন্ম নিবন্ধন
                </option>

            </select>

        </div>


        <!-- Document Upload -->
        <div class="field">

            <label
                for="verificationDocument"
                data-i18n="uploadLabel">
                নথি আপলোড করুন
            </label>

            <input
                id="verificationDocument"
                name="verification_document"
                type="file"
                accept="image/jpeg,image/png,application/pdf"
            >

            <p
                class="hint"
                data-i18n="uploadHint">
                JPG, PNG অথবা PDF গ্রহণযোগ্য। সর্বোচ্চ ফাইল সাইজ 5 MB।
            </p>

        </div>


        <!-- Submit -->
        <button
            class="btn"
            type="submit"
            id="submitVerification"
            data-i18n="submitForReview">
            যাচাইয়ের জন্য পাঠান
        </button>

    </form>

</section>


<!-- =========================
     VERIFICATION STATUS
     ========================= -->

<section class="card">

    <h2 data-i18n="currentStatus">
        বর্তমান অবস্থা
    </h2>

    <p
        id="verificationStatus"
        class="status status-unverified"
        data-i18n="statusUnverified">
        যাচাই করা হয়নি
    </p>

    <!-- Rejection reason appears only if rejected -->
    <p
        id="rejectionReason"
        hidden>
    </p>

</section>


<!-- =========================
     BACK TO PROFILE
     ========================= -->

<p class="back-row">

    <a
        href="/profile/"
        class="back-link"
        data-i18n="backToProfile">
        ← প্রোফাইলে ফিরে যান
    </a>
</p>
<p>
    <a
        href="/dashboard/"
        class="back-link"
        data-i18n="backToDashboard">
        ← Dashboard ফিরে যান
    </a>

</p>

</main>

<!-- ========================= JAVASCRIPT ========================= -->

<script src="{% static 'js/api.js' %}"></script>

<script src="{% static 'js/i18n.js' %}"></script>

<script src="{% static 'js/auth.js' %}"></script>

<script src="{% static 'js/nid-verification.js' %}"></script>

</body> </html>
