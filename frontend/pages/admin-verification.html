{% load static %}
<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title data-i18n="adminVerificationTitle">Admin Verification | HELPNET</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header class="site-header">
    <a href="/admin-dashboard/" class="logo">
        হেল্পনেট
    </a>

    <div class="header-actions">
        <button type="button" id="logoutButton" class="lang-toggle" data-i18n="logout">
            লগআউট
        </button>
    </div>
<button id="langToggle" class="lang-toggle" data-i18n="langButton">English</button></header>

<main class="page">

    <section class="card">
        <h1 data-i18n="adminVerificationTitle">Admin Verification</h1>

        <p class="subtitle">
            <span data-i18n="verificationSubtitle">Pending verification requests review করুন।</span>
        </p>
    </section>

    <section class="card">

        <h2 data-i18n="pendingRequests">Pending Requests</h2>

        <div id="verificationList">
            <p id="loadingMessage">
                <span data-i18n="loadingVerifications">Loading verification requests...</span>
            </p>
        </div>

    </section>

    <p class="back-row">
        <a href="/admin-dashboard/" class="back-link">
            ← <span data-i18n="adminDashboard">Admin Dashboard</span>
        </a>
    </p>

</main>

<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/admin-verification.js' %}"></script>

<script src="{% static 'js/i18n.js' %}"></script></body>
</html>
