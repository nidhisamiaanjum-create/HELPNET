{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goods chat | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body>
<header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><nav><a href="/goods-conversations/" class="back-link">Conversations</a><a id="chatListingLink" class="back-link">Listing</a><button id="langToggle" type="button" class="small-btn">English</button></nav></header>
<main class="blood-page"><section class="blood-card"><h1 id="chatTitle">Goods conversation</h1><p id="chatOther" class="hint"></p><p id="chatMessage" class="form-message" aria-live="polite"></p><div id="chatHistory" aria-live="polite"></div><form id="chatForm"><div class="field"><label for="chatInput">Message</label><textarea id="chatInput" maxlength="2000" required></textarea></div><button id="chatSend" class="btn" type="submit">Send</button><button id="chatRefresh" class="small-btn" type="button">Refresh messages</button></form></section></main>
<script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/goods-chat.js' %}"></script><script src="{% static 'js/i18n.js' %}"></script><script src="{% static 'js/navigation.js' %}"></script></body></html>
