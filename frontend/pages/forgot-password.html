{% load static %}
<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Forgot Password | HELPNET</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="site-header">
    <a href="/" class="logo">
        হেল্পনেট
    </a>
</header>

<main class="page">

    <section class="card">

        <h1>পাসওয়ার্ড ভুলে গেছেন?</h1>

        <p class="subtitle">
            আপনার অ্যাকাউন্টের ইমেইল দিন। আমরা পাসওয়ার্ড রিসেট করার নির্দেশনা পাঠাব।
        </p>

        <form id="forgotPasswordForm">

            <div class="field">

                <label for="email">
                    ইমেইল
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="আপনার ইমেইল লিখুন"
                    required
                >

            </div>

            <p
                id="forgotPasswordMessage"
                class="form-message"
                hidden
            ></p>

            <button
                type="submit"
                class="btn"
                id="forgotPasswordButton"
            >
                Reset Password
            </button>

        </form>

        <p class="back-row">
            <a href="/login/" class="back-link">
                ← Login এ ফিরে যান
            </a>
        </p>

    </section>

</main>

<script src="{% static 'js/forgot-password.js' %}"></script>

</body>
</html>
