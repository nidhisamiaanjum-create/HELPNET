{% load static %}

<!DOCTYPE html>

<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>HELPNET – সামাজিক সেবা প্ল্যাটফর্ম</title>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Django static CSS -->
<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body>

<main class="home-page">

    <!-- LANGUAGE BUTTON -->
    <button type="button" id="langToggle" class="home-language-switch">
    English
    </button>

    <!-- HELPNET LOGO -->
    <div class="home-logo">
        <div class="logo-icon">
            <svg viewBox="0 0 60 60" width="64" height="64">

                <circle
                    cx="30"
                    cy="22"
                    r="10"
                    fill="none"
                    stroke="#fff"
                    stroke-width="2.5"
                />

                <path
                    d="M12 52c0-9.94 8.06-18 18-18s18 8.06 18 18"
                    fill="none"
                    stroke="#fff"
                    stroke-width="2.5"
                    stroke-linecap="round"
                />

                <path
                    d="M30 16v12M24 22h12"
                    stroke="#fff"
                    stroke-width="2.5"
                    stroke-linecap="round"
                />

                <circle
                    cx="44"
                    cy="16"
                    r="6"
                    fill="rgba(255,255,255,0.25)"
                    stroke="#fff"
                    stroke-width="1.5"
                />

                <path
                    d="M42 16l1.5 1.5L47 13"
                    stroke="#fff"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </svg>
        </div>
    </div>

    <!-- TITLE -->
    <h1 class="home-title" data-i18n="appName">হেল্পনেট</h1>

    <!-- SUBTITLE -->
    <p class="home-subtitle" data-i18n="homeSubtitle">
    সংযুক্ত হোন। সাহায্য করুন। ভাগ করুন।
    </p>

    <!-- DESCRIPTION -->
    <p class="home-description" data-i18n="welcomeText">
    আপনার সম্প্রদায়ের মানুষের সাথে সংযুক্ত হয়ে
    সাহায্য, সেবা ও সম্পদ ভাগ করে নিন।
    </p>

    <!-- BUTTONS -->
    <div class="home-buttons">

        <a href="/login/" class="btn-primary">
            <span data-i18n="goLogin">লগইন করুন</span>
        </a>

        <a href="/register/" class="btn-outline">
              <span data-i18n="goRegister">নতুন অ্যাকাউন্ট তৈরি করুন</span>
        </a>

    </div>

    <!-- FOOTER -->
    <p class="home-footer" data-i18n="tagline">
        HELPNET — A Unified Community Services Platform
    </p>

</main>

<!-- Django static JS -->
<script src="{% static 'js/i18n.js' %}"></script>

</body>
</html>
