{% load static %}

<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Settings | HELPNET</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<header class="site-header">

    <a href="/dashboard/" class="logo">
        হেল্পনেট
    </a>

    <div class="header-actions">

        <button
            type="button"
            id="langToggle"
            class="lang-toggle"
            data-i18n="langButton">
            English
        </button>

        <a
            href="/profile/"
            class="back-link" data-i18n="profile">
            ← Profile
        </a>

    </div>

</header>


<main class="profile-container">

    <section class="profile-card">

        <h1 data-i18n="settingsTitle">Settings</h1>

        <p data-i18n="settingsIntro">
            Manage your account and privacy settings.
        </p>

        <form id="settingsForm">

            <div class="privacy-settings">

                <h2 data-i18n="privacySettings">Privacy Settings</h2>

                <p data-i18n="privacyChoice">
                    Choose which information other users can see.
                </p>


                <label>
                    <input
                        type="checkbox"
                        id="showPhone"
                        name="is_phone_visible">
                    <span data-i18n="showPhone">Show my phone number</span>
                </label>


                <label>
                    <input
                        type="checkbox"
                        id="showEmail"
                        name="is_email_visible">
                    <span data-i18n="showEmail">Show my email address</span>
                </label>


                <label>
                    <input
                        type="checkbox"
                        id="showLocation"
                        name="is_location_visible">
                    <span data-i18n="showLocation">Show my location</span>
                </label>


                <label>
                    <input
                        type="checkbox"
                        id="showDob"
                        name="is_date_of_birth_visible">
                    <span data-i18n="showDateOfBirth">Show my date of birth</span>
                </label>

            </div>


            <button
                type="submit"
                class="btn">
                <span data-i18n="saveSettings">Save Settings</span>
            </button>

            <p
                id="settingsMessage"
                class="form-message"
                aria-live="polite">
            </p>

        </form>

    </section>

</main>


<script src="{% static 'js/api.js' %}"></script>

<script>

document.addEventListener("DOMContentLoaded", async function () {

    const form = document.getElementById("settingsForm");
    const message = document.getElementById("settingsMessage");

    const token = localStorage.getItem("helpnet_token");

    if (!token) {
        window.location.href = "/login/";
        return;
    }


    /* =========================
       LOAD CURRENT SETTINGS
    ========================= */

    try {

        const response = await fetch("/api/auth/me/", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        const result = await response.json();

        if (!response.ok) {
            window.location.href = "/login/";
            return;
        }

        const user = result.data || result;

        document.getElementById("showPhone").checked =
            user.is_phone_visible ?? true;

        document.getElementById("showEmail").checked =
            user.is_email_visible ?? true;

        document.getElementById("showLocation").checked =
            user.is_location_visible ?? true;

        document.getElementById("showDob").checked =
            user.is_date_of_birth_visible ?? true;

    } catch (error) {

        console.error("Failed to load settings:", error);

        message.textContent = t("settingsLoadedError");

    }


    /* =========================
       SAVE SETTINGS
    ========================= */

    form.addEventListener("submit", async function (event) {

        event.preventDefault();

        const payload = {

            is_phone_visible:
                document.getElementById("showPhone").checked,

            is_email_visible:
                document.getElementById("showEmail").checked,

            is_location_visible:
                document.getElementById("showLocation").checked,

            is_date_of_birth_visible:
                document.getElementById("showDob").checked
        };


        try {

            const response = await fetch("/api/auth/me/", {

                method: "PATCH",

                headers: {
                    "Authorization": "Bearer " + token,
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(payload)

            });


            const result = await response.json();


            if (!response.ok) {

                message.textContent = result.message || t("settingsSaveError");

                return;
            }


            message.textContent = t("settingsSaved");

        } catch (error) {

            console.error("Failed to save settings:", error);

            message.textContent = t("settingsSaveError");

        }

    });

});

</script>

<script src="{% static 'js/i18n.js' %}"></script></body>
</html>
