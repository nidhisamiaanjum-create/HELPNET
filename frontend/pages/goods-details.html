{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goods listing | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><nav><a href="/goods-list/" class="back-link">Goods list</a><button id="langToggle" type="button" class="small-btn">বাংলা</button></nav></header><main class="blood-page"><p id="goodsMessage" class="form-message" aria-live="polite"></p><section class="blood-card"><div id="goodsDetails">Loading listing…</div><div id="goodsOwnerControls" hidden><div class="field"><label for="goodsStatus">Listing status</label><select id="goodsStatus"><option>Available</option><option>Reserved</option><option>Exchanged</option><option>Removed</option></select></div><button id="saveGoodsStatus" class="btn" type="button">Update status</button></div><div id="goodsInterestControls"><button id="goodsInterestButton" class="btn" type="button">I am interested</button></div></section><section class="blood-card"><h2>Report this listing</h2><form id="goodsReportForm"><div class="field"><label for="goodsReportReason">Reason</label><input id="goodsReportReason" maxlength="120" required></div><div class="field"><label for="goodsReportDescription">Details (optional)</label><textarea id="goodsReportDescription"></textarea></div><button class="btn" type="submit">Submit report</button></form><p id="goodsReportMessage" class="form-message" aria-live="polite"></p></section><section class="blood-card"><h2>Disclaimer</h2><p>HELPNET does not handle payments and does not guarantee item condition. Exchanges are arranged directly between users.</p></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/i18n.js' %}"></script><script src="{% static 'js/goods.js' %}"></script></body></html>
