{% load static %}<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="goodsListTitle">Goods listing | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><nav><a href="/goods-list/" class="back-link" data-i18n="goodsListTitle">Goods list</a><button id="langToggle" type="button" class="small-btn">বাংলা</button></nav></header><main class="blood-page"><p id="goodsMessage" class="form-message" aria-live="polite"></p><section class="blood-card"><div id="goodsDetails" data-i18n="loadingListings">Loading listing…</div><div id="goodsOwnerControls" hidden><div class="field"><label for="goodsStatus" data-i18n="listingStatus">Listing status</label><select id="goodsStatus"><option data-i18n="statusAvailable">Available</option><option data-i18n="statusReserved">Reserved</option><option data-i18n="statusExchanged">Exchanged</option><option data-i18n="statusRemoved">Removed</option></select></div><button id="saveGoodsStatus" class="btn" type="button" data-i18n="updateStatus">Update status</button></div><div id="goodsInterestControls" hidden><button id="goodsInterestButton" class="btn" type="button" data-i18n="expressInterest">Express Interest</button></div></section><section class="blood-card"><h2 data-i18n="reportListing">Report this listing</h2><form id="goodsReportForm"><div class="field"><label for="goodsReportReason" data-i18n="reason">Reason</label><input id="goodsReportReason" maxlength="120" required></div><div class="field"><label for="goodsReportDescription" data-i18n="detailsOptional">Details (optional)</label><textarea id="goodsReportDescription"></textarea></div><button class="btn" type="submit" data-i18n="submitReport">Submit report</button></form><p id="goodsReportMessage" class="form-message" aria-live="polite"></p></section><section class="blood-card"><h2 data-i18n="goodsDisclaimerTitle">Disclaimer</h2><p data-i18n="goodsDisclaimer">HELPNET does not handle payments and does not guarantee item condition. Exchanges are arranged directly between users.</p></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/i18n.js' %}"></script><script src="{% static 'js/goods.js' %}"></script></body></html>
