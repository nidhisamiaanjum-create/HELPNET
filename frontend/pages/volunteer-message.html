{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event messages | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a></header><main class="blood-page"><section class="blood-card"><h1>Event messages</h1><p>Choose one of your events or volunteer signups.</p><div class="field"><label for="messageEventId">Event</label><select id="messageEventId" required><option value="">Loading your events…</option></select></div><p id="volunteerMessage" class="form-message" aria-live="polite"></p><div id="messageList"></div><form id="eventMessageForm"><div class="field"><label for="eventMessage">Message</label><textarea id="eventMessage" maxlength="2000" required></textarea></div><button class="btn">Send message</button></form></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/volunteer.js' %}"></script></body></html>
