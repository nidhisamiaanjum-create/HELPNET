{% load static %}<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="createGoodsTitle">List goods | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><nav><a href="/goods-list/" class="back-link" data-i18n="goodsListTitle">Goods list</a><button id="langToggle" type="button" class="small-btn">বাংলা</button></nav></header><main class="blood-page"><section class="blood-card"><h1 data-i18n="createGoodsTitle">Create a goods listing</h1><p id="goodsMessage" class="form-message" aria-live="polite"></p><form id="goodsCreateForm"><div class="field"><label for="goodsTitle" data-i18n="itemTitle">Title</label><input id="goodsTitle" maxlength="200" required></div><div class="field"><label for="goodsDescription" data-i18n="itemDescription">Description</label><textarea id="goodsDescription" required></textarea></div><div class="field"><label for="goodsCondition" data-i18n="itemCondition">Condition</label><select id="goodsCondition" required><option value="" data-i18n="selectCondition">Select condition</option><option data-i18n="conditionNew">New</option><option data-i18n="conditionLikeNew">Like new</option><option data-i18n="conditionGood">Good</option><option data-i18n="conditionFair">Fair</option><option data-i18n="conditionForParts">For parts</option></select></div><div class="field"><label for="goodsPrice" data-i18n="askingPrice">Asking price</label><input id="goodsPrice" type="number" min="0" step="0.01" required></div><div class="field"><label for="goodsLocation" data-i18n="itemLocation">Location</label><input id="goodsLocation" maxlength="255" required></div><div class="field"><label for="goodsImage" data-i18n="itemImageOptional">Image (optional)</label><input id="goodsImage" type="file" accept="image/*"></div><button class="btn" type="submit" data-i18n="createListing">Create listing</button></form></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/i18n.js' %}"></script><script src="{% static 'js/goods.js' %}"></script></body></html>
