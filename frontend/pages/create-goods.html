{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>List goods | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><nav><a href="/goods-list/" class="back-link">Goods list</a><button id="langToggle" type="button" class="small-btn">বাংলা</button></nav></header><main class="blood-page"><section class="blood-card"><h1>Create a goods listing</h1><p id="goodsMessage" class="form-message" aria-live="polite"></p><form id="goodsCreateForm"><div class="field"><label for="goodsTitle">Title</label><input id="goodsTitle" maxlength="200" required></div><div class="field"><label for="goodsDescription">Description</label><textarea id="goodsDescription" required></textarea></div><div class="field"><label for="goodsCondition">Condition</label><select id="goodsCondition" required><option value="">Select condition</option><option>New</option><option>Like new</option><option>Good</option><option>Fair</option><option>For parts</option></select></div><div class="field"><label for="goodsPrice">Asking price</label><input id="goodsPrice" type="number" min="0" step="0.01" required></div><div class="field"><label for="goodsLocation">Location</label><input id="goodsLocation" maxlength="255" required></div><div class="field"><label for="goodsImage">Image (optional)</label><input id="goodsImage" type="file" accept="image/*"></div><button class="btn" type="submit">Create listing</button></form></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/i18n.js' %}"></script><script src="{% static 'js/goods.js' %}"></script></body></html>
