{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer profile | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a></header><main class="blood-page"><section class="blood-card"><h1>Volunteer profile</h1><p id="profileMessage" class="form-message" aria-live="polite"></p><form id="volunteerProfileForm"><div class="field"><label for="skills">Skills</label><textarea id="skills" placeholder="First aid, teaching, logistics"></textarea></div><div class="field"><label for="availability">Availability</label><input id="availability" placeholder="Weekends, evenings"></div><div class="field"><label for="volunteerLocation">Location</label><input id="volunteerLocation"></div><div class="field"><label for="volunteerBloodGroup">Blood group</label><select id="volunteerBloodGroup"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="field"><label for="certificates">Supporting certificates</label><textarea id="certificates" placeholder="Names or links, one per line"></textarea></div><button class="btn">Save profile</button></form></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/volunteer-profile.js' %}"></script></body></html>
