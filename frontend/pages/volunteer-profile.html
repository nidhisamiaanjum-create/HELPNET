{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volunteer profile | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><button id="langToggle" class="lang-toggle" data-i18n="langButton">English</button></header><main class="blood-page"><section class="blood-card"><h1 data-i18n="volunteerProfile">Volunteer profile</h1><p id="profileMessage" class="form-message" aria-live="polite"></p><form id="volunteerProfileForm"><div class="field"><label for="skills" data-i18n="skills">Skills</label><textarea id="skills" placeholder="First aid, teaching, logistics" data-i18n-placeholder="profileSkillsHint"></textarea></div><div class="field"><label for="availability" data-i18n="availability">Availability</label><input id="availability" placeholder="Weekends, evenings" data-i18n-placeholder="profileAvailabilityHint"></div><div class="field"><label for="volunteerLocation" data-i18n="location">Location</label><input id="volunteerLocation"></div><div class="field"><label for="volunteerBloodGroup" data-i18n="bloodGroup">Blood group</label><select id="volunteerBloodGroup"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div><div class="field"><label for="certificates" data-i18n="certificates">Supporting certificates</label><textarea id="certificates" placeholder="Names or links, one per line" data-i18n-placeholder="profileCertificatesHint"></textarea></div><button class="btn" data-i18n="saveProfile">Save profile</button></form><hr><h2>Upload certificate</h2><p>PDF, JPG or PNG; maximum 5 MB per file.</p><form id="certificateUploadForm"><div class="field"><label for="certificateFile">Certificate file</label><input id="certificateFile" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div><button class="btn" type="submit">Upload</button></form><div id="uploadedCertificates"></div></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/volunteer-profile.js' %}"></script><script src="{% static 'js/i18n.js' %}"></script></body></html>
