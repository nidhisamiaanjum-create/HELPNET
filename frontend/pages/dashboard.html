{% load static %}
<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HELPNET - Dashboard</title>

    <!-- Django Static CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <a href="/" class="logo" data-i18n="appName">
            হেল্পনেট
        </a>

        <div class="header-actions">

            <!-- Language -->
            <button
                type="button"
                id="langToggle"
                class="lang-toggle">
                English
            </button>

            <!-- Logout -->
            <button
                type="button"
                id="logoutButton"
                class="lang-toggle"
                data-i18n="logout">
                Logout
            </button>

        </div>

    </header>


    <!-- =====================================================
         DASHBOARD
         ===================================================== -->

    <main class="page">

        <div class="card">

            <!-- Title -->
            <h1 data-i18n="dashboardTitle">
                Dashboard
            </h1>

            <p class="subtitle" data-i18n="dashboardSubtitle">
                Welcome to HELPNET
            </p>


            <!-- =================================================
                 USER INFORMATION
                 ================================================= -->

            <!-- Name -->
            <div class="field">

                <label data-i18n="fullName">
                    Name
                </label>

                <div id="userName">
                    -
                </div>

            </div>


            <!-- Email -->
            <div class="field">

                <label data-i18n="email">
                    Email
                </label>

                <div id="userEmail">
                    -
                </div>

            </div>


            <!-- Phone -->
            <div class="field">

                <label data-i18n="phone">
                    Phone
                </label>

                <div id="userPhone">
                    -
                </div>

            </div>


            <!-- Role -->
            <div class="field">

                <label data-i18n="role">
                    Role
                </label>

                <div id="userRole">
                    -
                </div>

            </div>


            <!-- =================================================
                 HOME LINK
                 ================================================= -->

            <div class="form-links">

                <p>
                    <a href="/" data-i18n="backToHome">
                        Back to Home
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="{% static 'js/api.js' %}"></script>

    <script src="{% static 'js/i18n.js' %}"></script>

    <script src="{% static 'js/auth.js' %}"></script>


    <!-- =====================================================
         DASHBOARD INITIALIZATION
         ===================================================== -->

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            /*
             * Check whether the user is logged in.
             *
             * If there is no JWT token,
             * requireLogin() redirects to login.
             */

            if (!requireLogin()) {
                return;
            }


            /*
             * Get the user information
             * saved during login.
             */

            const user = getStoredUser();


            /*
             * If no user information exists,
             * stop here.
             */

            if (!user) {
                console.error("No stored user information found.");
                return;
            }


            /*
             * Get dashboard elements.
             */

            const userName =
                document.getElementById("userName");

            const userEmail =
                document.getElementById("userEmail");

            const userPhone =
                document.getElementById("userPhone");

            const userRole =
                document.getElementById("userRole");


            /*
             * Display user information.
             */

            if (userName) {
                userName.textContent =
                    user.full_name || "-";
            }

            if (userEmail) {
                userEmail.textContent =
                    user.email || "-";
            }

            if (userPhone) {
                userPhone.textContent =
                    user.phone_number || "-";
            }

            if (userRole) {
                userRole.textContent =
                    user.role || "-";
            }

        });
    </script>

</body>
</html>
