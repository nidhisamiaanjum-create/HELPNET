{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask the community | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><nav><a href="/health-questions/" class="back-link">Health questions</a><button id="langToggle" type="button" class="small-btn">বাংলা</button></nav></header><main class="blood-page"><section class="blood-card"><h1>Create a health question</h1><p id="healthMessage" class="form-message" aria-live="polite"></p><form id="healthQuestionForm"><div class="field"><label for="healthTitle">Title</label><input id="healthTitle" maxlength="200" required></div><div class="field"><label for="healthDescription">Description</label><textarea id="healthDescription" rows="5" required></textarea></div><div class="field"><label for="healthCategory">Category</label><input id="healthCategory" maxlength="80" required></div><button class="btn" type="submit">Submit question</button></form><p class="hint">HELPNET does not diagnose, endorse, or recommend any professional or treatment. Community suggestions are not medical advice.</p></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/i18n.js' %}"></script><script src="{% static 'js/health.js' %}"></script></body></html>
