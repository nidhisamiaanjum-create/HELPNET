{% load static %}
<!doctype html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Logs | HELPNET</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>

<body>

<header class="site-header">
    <a href="/admin-dashboard/" class="logo">
        হেল্পনেট
    </a>

    <div class="header-actions">
        <button
            type="button"
            id="logoutButton"
            class="lang-toggle"
        >
            লগআউট
        </button>
    </div>
</header>


<main class="page">

    <section class="card">
        <h1>Admin Audit Logs</h1>

        <p class="subtitle">
            Admin actions and verification activities.
        </p>
    </section>


    <section class="card">

        <h2>Activity History</h2>

        <div id="logsContainer">

            <p id="loadingMessage">
                Loading admin logs...
            </p>

        </div>

    </section>


    <p class="back-row">
        <a
            href="/admin-dashboard/"
            class="back-link"
        >
            ← Admin Dashboard
        </a>
    </p>

</main>


<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/admin-logs.js' %}"></script>

</body>
</html>
