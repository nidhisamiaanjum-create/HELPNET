{% load static %}<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create volunteer opportunity | HELPNET</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body><header class="site-header"><a href="/dashboard/" class="logo">HELPNET</a><a href="/volunteer-opportunities/" class="back-link">Opportunities</a></header><main class="blood-page"><section class="blood-card"><h1>Create opportunity</h1><p id="volunteerMessage" class="form-message" aria-live="polite"></p><form id="opportunityForm"><div class="field"><label for="eventTitle">Title</label><input id="eventTitle" maxlength="200" required></div><div class="field"><label for="eventDescription">Description</label><textarea id="eventDescription" required></textarea></div><div class="field"><label for="eventDate">Date</label><input id="eventDate" type="date" required></div><div class="field"><label for="eventLocation">Location</label><input id="eventLocation" required></div><div class="field"><label for="eventRequired">Required volunteers</label><input id="eventRequired" type="number" min="1" required></div><button class="btn" type="submit">Create opportunity</button></form></section></main><script src="{% static 'js/api.js' %}"></script><script src="{% static 'js/auth.js' %}"></script><script src="{% static 'js/volunteer.js' %}"></script></body></html>
