{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Health community | HELPNET</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <header class="site-header"><a href="/dashboard/" class="logo" data-i18n="appName">HELPNET</a>
        <nav><a href="/dashboard/" class="back-link" data-i18n="backToDashboard" data-smart-back>Back to dashboard</a>
            <a href="/health-professionals/" class="back-link" data-i18n="Professionals">Professionals</a>
            <button id="langToggle" type="button"
                class="small-btn">বাংলা</button></nav>
    </header>
    <main class="blood-page">
        <section class="blood-card">
            <h1 data-i18n="healthcommunityquestions">Health community questions</h1>
            <p id="healthMessage" class="form-message" aria-live="polite"></p>
            <p class="health-question-create-row"><a class="small-btn health-create-question" href="/create-health-question/" data-i18n="createQuestion">Create a question</a></p>
            <div id="healthQuestions">Loading questions…</div>
            <p class="hint" data-i18n="healthDisclaimer">HELPNET does not endorse or recommend health professionals.
                Contact information shown here is user-provided and is not medical advice.</p>
        </section>
    </main>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/auth.js' %}"></script>
    <script src="{% static 'js/i18n.js' %}"></script>
    <script src="{% static 'js/health.js' %}"></script>
    <script src="{% static 'js/navigation.js' %}"></script>
</body>

</html>
