{% load static %}
<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HELPNET</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Header -->
    <header class="site-header"> 

        <a
            href="/"
            class="logo"
            data-i18n="appName"
        >
            হেল্পনেট
        </a>

        <div class="header-actions">

            <button
                type="button"
                id="langToggle"
                class="lang-toggle"
            >
                English
            </button>

        </div>

    </header>


    <!-- Register -->
    <main class="page">

        <div class="card">

            <h1 data-i18n="registerTitle"></h1>

            <p
                class="subtitle"
                data-i18n="registerSubtitle"
            ></p>


            <!-- Alert -->
            <div
                id="formAlert"
                class="alert"
            ></div>


            <!-- Register Form -->
            <form
                id="registerForm"
                novalidate
            >
            
                <!-- Account Type -->
                <div class="field">
                    <label for="accountType" data-i18n="AccountType">Account Type</label>
                    <select id="accountType" name="accountType" required>
                        <option value="citizen" selected data-i18n="Citizen">Citizen</option>
                        <option value="ngo" data-i18n="NGO">NGO</option>
                    </select>
                    <div class="hint" id="accountTypeHint">
                        NGOs must be approved by an administrator before accessing NGO services.
                    </div>
                </div>

                <!-- Full Name -->
                <div class="field">

                    <label
                        for="fullName"
                        data-i18n="fullName"
                    ></label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        autocomplete="name"
                        required
                    >

                    <div
                        class="field-error"
                        id="fullNameError"
                    ></div>

                </div>


                <!-- Phone -->
                <div class="field">

                    <label
                        for="phoneNumber"
                        data-i18n="phone"
                    ></label>

                    <input
                        type="tel"
                        id="phoneNumber"
                        name="phoneNumber"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >

                    <div
                        class="hint"
                        data-i18n="phoneHint"
                    ></div>

                    <div
                        class="field-error"
                        id="phoneNumberError"
                    ></div>

                </div>


                <!-- Password -->
                <div class="field">

                    <label
                        for="password"
                        data-i18n="password"
                    ></label>

                    <div class="password-input-wrap">
                        <input type="password" id="password" name="password" autocomplete="new-password" required>
                        <button type="button" class="password-toggle" data-password-toggle="password" aria-controls="password" aria-pressed="false" onclick="return togglePasswordVisibility(this)" data-i18n="showPassword">Show</button>
                    </div>

                    <div
                        class="hint"
                        data-i18n="passwordHint"
                    ></div>

                    <div
                        class="field-error"
                        id="passwordError"
                    ></div>

                </div>


                <!-- Email -->
                <div class="field">

                    <label
                        for="email"
                        data-i18n="email"
                    ></label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                    <div
                        class="field-error"
                        id="emailError"
                    ></div>

                </div>


                <!-- District -->
                <div class="field">

                    <label for="district">

                        <span data-i18n="district"></span>

                        <span
                            class="optional"
                            data-i18n="optional"
                        ></span>

                    </label>

                    <select
                        id="district"
                        name="district"
                    >

                        <option
                            value=""
                            data-i18n="selectDistrict"
                        ></option>

                    </select>

                </div>


                <!-- Upazila -->
                <div class="field">

                    <label for="upazila">

                        <span data-i18n="upazila"></span>

                        <span
                            class="optional"
                            data-i18n="optional"
                        ></span>

                    </label>

                    <input
                        type="text"
                        id="upazila"
                        name="upazila"
                    >

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    id="registerButton"
                    class="btn"
                    data-i18n="registerButton"
                ></button>

            </form>


            <!-- Login Link -->
            <div class="form-links">

                <p>

                    <span data-i18n="haveAccount"></span>

                    <a
                        href="/login/"
                        data-i18n="loginLink"
                    ></a>

                </p>

            </div>

        </div>

    </main>


    <!-- JavaScript -->
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/i18n.js' %}"></script>
    <script src="{% static 'js/districts.js' %}"></script>
    <script src="{% static 'js/auth.js' %}?v=2"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (typeof populateDistricts === "function") {
                populateDistricts("district");
            }
        });
    </script>

</body>

</html>
