<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELPNET</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="site-header">
    <a href="../index.html" class="logo" data-i18n="appName">হেল্পনেট</a>
    <div class="header-actions">
      <button type="button" id="langToggle" class="lang-toggle">English</button>
    </div>
  </header>

  <main class="page">
    <div class="card">
      <h1 data-i18n="registerTitle"></h1>
      <p class="subtitle" data-i18n="registerSubtitle"></p>

      <div id="formAlert" class="alert"></div>

      <form id="registerForm" novalidate>

        <div class="field">
          <label for="fullName" data-i18n="fullName"></label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" required>
          <div class="field-error" id="fullNameError"></div>
        </div>

        <div class="field">
          <label for="phoneNumber" data-i18n="phone"></label>
          <input type="tel" id="phoneNumber" name="phoneNumber"
                 inputmode="numeric" autocomplete="tel" required>
          <div class="hint" data-i18n="phoneHint"></div>
          <div class="field-error" id="phoneNumberError"></div>
        </div>

        <div class="field">
          <label for="password" data-i18n="password"></label>
          <input type="password" id="password" name="password"
                 autocomplete="new-password" required>
          <div class="hint" data-i18n="passwordHint"></div>
          <div class="field-error" id="passwordError"></div>
        </div>

        <div class="field">
          <label for="email">
            <span data-i18n="email"></span>
          </label>
          <input type="email" id="email" name="email" autocomplete="email">
          <div class="field-error" id="emailError"></div>
        </div>

        <div class="field">
          <label for="district">
            <span data-i18n="district"></span>
            <span class="optional" data-i18n="optional"></span>
          </label>
          <select id="district" name="district">
            <option value="" data-i18n="selectDistrict"></option>
          </select>
        </div>

        <div class="field">
          <label for="upazila">
            <span data-i18n="upazila"></span>
            <span class="optional" data-i18n="optional"></span>
          </label>
          <input type="text" id="upazila" name="upazila">
        </div>

        <button type="submit" id="registerButton" class="btn"
                data-i18n="registerButton"></button>
      </form>

      <div class="form-links">
        <p>
          <span data-i18n="haveAccount"></span>
          <a href="login.html" data-i18n="loginLink"></a>
        </p>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/districts.js"></script>
<script src="../js/auth.js"></script>

<script>
    populateDistricts("district");
    initRegisterPage();
</script>
</body>
</html>
